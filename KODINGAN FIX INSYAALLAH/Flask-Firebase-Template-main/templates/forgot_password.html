<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/default_logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <title>Reset Password - SmartPaint</title>
  <style>
    body { background: var(--off-white); }
    main { min-height: 100vh; }
  </style>
</head>
<body>
  {% include 'navbar_public.html' %}
  <main>
    <div class="auth-page_container">
      <div class="login-form-container" id="reset-password-view">
        <div class="login-form">
          <h2>Reset Password</h2>
          <div class="input-group">
            <input type="email" id="email-forgot-password" name="email" placeholder="Masukkan email Anda" required>
            <div id="email-error-message" class="error-msg"></div>
          </div>
          <div id="forgot-password-btn" class="login-btn">Kirim Link Reset</div>
        </div>
      </div>
      <button id="back-to-login-btn" onclick="window.location='/login'" class="login-link-btn">Kembali ke Login</button>
      <div id="reset-password-confirmation-page" style="display:none; text-align:center; margin-top:24px; background:var(--white); padding:40px; border-radius:var(--radius-xl); border:1px solid var(--gray-100); box-shadow:var(--shadow-lg);">
        <h2 style="margin-bottom:12px;">Email Terkirim</h2>
        <p>Silakan cek email Anda untuk instruksi reset password.</p>
        <a href="{{ url_for('login') }}" class="btn-primary" style="margin-top:16px;">Kembali ke Login</a>
      </div>
    </div>
  </main>
  {% include 'footer.html' %}
  <script src="{{ url_for('static', filename='login-auth.js') }}" type="module"></script>
</body>
</html>
