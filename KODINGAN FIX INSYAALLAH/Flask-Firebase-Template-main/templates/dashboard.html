<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/default_logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <title>Dashboard - SmartPaint</title>
  <style>
    main {
      flex-direction: column;
      padding: 72px 48px 60px;
      background: var(--off-white);
    }

    .dash-header {
      text-align: center;
      margin-bottom: 48px;
      padding-top: 48px;
    }

    .dash-header h1 { font-size: 2rem; font-weight: 800; margin-bottom: 8px; }
    .dash-header p { font-size: 0.95rem; color: var(--gray-400); max-width: 440px; margin: 0 auto; }

    .dash-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      max-width: 960px;
      width: 100%;
    }

    .dash-card {
      position: relative;
      height: 240px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background-size: cover;
      background-position: center;
      border: 1px solid var(--gray-100);
      box-shadow: var(--shadow-sm);
      transition: all 0.3s ease;
    }

    .dash-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-xl);
    }

    .dash-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(15,27,76,0.85) 0%, rgba(15,27,76,0.2) 100%);
      z-index: 1;
    }

    .dash-card a {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      padding: 24px;
      text-decoration: none;
      color: var(--white);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .dash-card a:hover { color: var(--white); }

    .dash-card:nth-child(1) { background-image: url("/static/images/Deteksi.jpg"); }
    .dash-card:nth-child(2) { background-image: url("/static/images/Monitoring.jpg"); }
    .dash-card:nth-child(3) { background-image: url("/static/images/Histori.webp"); }

    @media (max-width: 768px) {
      main { padding: 72px 20px 40px; }
      .dash-grid { grid-template-columns: 1fr; max-width: 400px; }
      .dash-card { height: 180px; }
    }
  </style>
</head>
<body>
  {% include 'navbar_private.html' %}
  <main>
    <div class="dash-header">
      <h1>Dashboard</h1>
      <p>Pilih menu di bawah untuk mulai menggunakan fitur SmartPaint.</p>
    </div>
    <div class="dash-grid">
      <div class="dash-card"><a href="{{ url_for('detect') }}">Deteksi Warna</a></div>
      <div class="dash-card"><a href="{{ url_for('monitoring') }}">Monitoring</a></div>
      <div class="dash-card"><a href="{{ url_for('history') }}">History</a></div>
    </div>
  </main>
  {% include 'footer.html' %}
</body>
</html>
