<nav class="navbar">
    <a href="{{ url_for('dashboard') }}">
        <img class="logo-img" src="{{ url_for('static', filename='images/default_logo.png') }}" alt="SmartPaint" />
    </a>
    <span class="hamburger">&#9776;</span>
    <div class="navbar-right" id="navbarRight">
        <span class="closebtn">&times;</span>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('detect') }}">Detection</a>
        <a href="{{ url_for('monitoring') }}">Monitoring</a>
        <a href="{{ url_for('history') }}">History</a>
        <a href="{{ url_for('about') }}">About</a>
        <a id="sign-out-btn" href="{{ url_for('logout') }}">Logout</a>
    </div>
</nav>
<div class="nav-overlay" id="navOverlay"></div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const hamburger = document.querySelector(".hamburger");
    const navbarRight = document.getElementById("navbarRight");
    const closebtn = document.querySelector(".closebtn");
    const overlay = document.getElementById("navOverlay");

    hamburger.addEventListener("click", () => {
        navbarRight.classList.add("active");
        overlay.classList.add("active");
    });

    function closeMenu() {
        navbarRight.classList.remove("active");
        overlay.classList.remove("active");
    }

    closebtn.addEventListener("click", closeMenu);
    overlay.addEventListener("click", closeMenu);
});
</script>
