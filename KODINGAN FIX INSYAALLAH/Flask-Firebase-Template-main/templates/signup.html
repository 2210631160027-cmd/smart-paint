<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/default_logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <title>Sign Up - SmartPaint</title>
  <style>
    body { background: var(--off-white); }
    main { min-height: 100vh; }
  </style>
</head>
<body>
  {% include 'navbar_public.html' %}
  <main>
    <div class="auth-page_container">
      <div class="login-form-container">
        <div class="login-form">
          <h2>Buat Akun</h2>
          <div class="input-group">
            <input type="email" id="email-input" name="email" placeholder="Email" required>
            <div id="email-error-message" class="error-msg"></div>
          </div>
          <div class="input-group">
            <input type="password" id="password-input" name="password" placeholder="Password" required>
            <div id="password-error-message" class="error-msg"></div>
          </div>
          <div id="create-account-btn" class="login-btn">Buat Akun</div>
          <div class="alt-signin-divider">or</div>
          <button id="sign-up-with-google-btn" class="google-login-btn">
            <img src="{{ url_for('static', filename='images/google-icon.png') }}" alt="Google" class="google-btn-logo">
            Sign up with Google
          </button>
          <div id="google-signin-error-message" class="error-msg"></div>
          <div class="signup-link-container">Sudah punya akun? <a href="{{ url_for('login') }}">Login</a></div>
        </div>
      </div>
    </div>
  </main>
  {% include 'footer.html' %}
  <script src="{{ url_for('static', filename='login-auth.js') }}" type="module"></script>
</body>
</html>
